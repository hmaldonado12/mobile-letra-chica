<ion-header>
  <ion-toolbar>
    <ion-title>Contract List</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar [(ngModel)]="searchTerm" placeholder="Search contracts"></ion-searchbar>
  <ion-list>
    <ion-item
      *ngFor="let contract of contracts" 
      button="true"
      (click)="openContract(contract.id)"
      class="contract-item"
      lines="none"
    >
      <ion-label>
        <strong>{{ contract.title }}</strong>
        <div class="contract-meta">
          <span class="contract-date">{{ contract.date }}</span>
          <span class="contract-status">{{ contract.status }}</span>
        </div>
      </ion-label>
    </ion-item>
