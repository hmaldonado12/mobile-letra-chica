<ion-header>
  <app-user-info-header></app-user-info-header>
  <ion-toolbar>
    <ion-title>Ver Contrato</ion-title>
    <ion-buttons slot="end">
      <app-theme-toggle></app-theme-toggle>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="resumen-contrato">
  <div class="container">

    <!-- TÍTULO GENERAL DEL DOCUMENTO -->
    <ion-card *ngIf="tituloGeneral">
      <ion-card-header>
        <ion-card-title class="titulo-general">
          {{ tituloGeneral }}
        </ion-card-title>
      </ion-card-header>
    </ion-card>

    <!-- SECCIONES PARSEADAS -->
    <ion-card *ngFor="let seccion of resumen">
      <ion-card-header>
        <ion-card-title>{{ seccion.icono }} {{ seccion.titulo }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ul>
          <li *ngFor="let punto of seccion.puntos">
            <strong *ngIf="punto.titulo">{{ punto.titulo }}:</strong> {{ punto.descripcion }}
          </li>
        </ul>
      </ion-card-content>
    </ion-card>
    <ion-button id="open-modal" expand="block" slot="fixed" class="guardar-btn">
      Guardar en carpeta
    </ion-button>

    <ion-alert
      [isOpen]="isAlertOpen"
      header="SUCCESSFUL"
      message="El contrato se ha guardado correctamente."
      [buttons]="alertButtons"
      (didDismiss)="setOpen(false)"
    ></ion-alert>
  </div>
  <ion-modal
    trigger="open-modal"
    [initialBreakpoint]="0.25"
    [breakpoints]="[0, 0.25, 0.5, 0.75, 1]"
    [expandToScroll]="false"
  >
    <ng-template>
      <ion-content>
        <ion-list *ngFor="let catgory of categories">
          <ion-item>
            <ion-checkbox
              slot="end"
              [checked]="catgory.selected"
              (ionChange)="onCheckboxChange(catgory.id, $event)">
            </ion-checkbox>
            <ion-label>
              <h2>{{catgory.name}}</h2>
            </ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>



<ion-footer>
  <app-footer ></app-footer>
</ion-footer>
