<ion-header>
  <ion-toolbar>
    <ion-title>Mis contratos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-grid>
    <ion-row>
      <ion-col size="6">
        <ion-button expand="block" class="custom-button" (click)="goNewContract()">
          <ion-icon slot="start" name="camera-outline"></ion-icon>
          Nuevo contrato
        </ion-button>
      </ion-col>
      <ion-col size="6">
        <ion-button expand="block" class="custom-button">
          <ion-icon slot="start" name="add-outline"></ion-icon>
          Nueva categoría
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-list class="folder-list">
    <ion-item *ngFor="let categoria of categories" lines="none">
      <ion-icon slot="start" name="folder-outline" class="folder-icon"></ion-icon>
      <ion-label>{{ categoria.name }}</ion-label>
    </ion-item>
  </ion-list>

</ion-content>

<ion-footer class="footer-with-button">
  <div class="footer-content">
    <ion-button class="home-button" (click)="goHome()">
      <ion-icon slot="icon-only" name="home-outline"></ion-icon>
    </ion-button>
  </div>
</ion-footer>
