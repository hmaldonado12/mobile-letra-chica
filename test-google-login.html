<!DOCTYPE html>
<html>
<head>
    <title>Test Google Login</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <h1>Test Google Login</h1>
    <div id="g_id_onload"
         data-client_id="889927933084-6o5i9bet4eemuovr7de4boa17a5gpkku.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard"></div>
    
    <script>
        function handleCredentialResponse(response) {
            console.log("Encoded JWT ID token: " + response.credential);
            document.getElementById('result').innerHTML = "✅ Login exitoso! Token: " + response.credential.substring(0, 50) + "...";
        }
    </script>
    
    <div id="result"></div>
</body>
</html>
